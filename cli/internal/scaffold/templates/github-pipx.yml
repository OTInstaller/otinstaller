# Publishes to PyPI with Trusted Publishing, pins the wheel hash in otinstaller.yaml and tags the release.
# The OTInstaller GitHub App publishes the tag; without the App, trust this repository
# (`ot namespace trust <namespace> github:<owner>/<repo>`) and set the repository variable OTINSTALLER_PUBLISH to oidc,
# and the last step publishes the release itself.
name: otinstaller release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match pyproject.toml)
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Pin wheel hash and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SHA=$(sha256sum dist/*.whl | cut -d' ' -f1)
          sed -i -E "s|^version: .*|version: ${VERSION}|; s|^  package_version: .*|  package_version: \"${VERSION}\"|; s|^  wheel_sha256: .*|  wheel_sha256: \"${SHA}\"|" otinstaller.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD "v${VERSION}"
      - name: Publish to OTInstaller
        if: vars.OTINSTALLER_PUBLISH == 'oidc'
        run: |
          curl -fsSL https://get.otinstaller.com/ot | OT_INSTALL_DIR="$RUNNER_TEMP" sh
          "$RUNNER_TEMP/ot" publish --oidc
