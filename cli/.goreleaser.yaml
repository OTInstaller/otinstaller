# GoReleaser v2 config for ot. Run by .github/workflows/release-cli.yml on a vX.Y.Z tag.
#
# Releases are published to their own repository (RELEASE_OWNER/RELEASE_NAME, default otinstaller/ot), where the install
# scripts and `ot self-update` look for them. checksums.txt is signed with the Ed25519 release key (checksums.txt.sig, which
# `ot self-update` and the install scripts verify) and with cosign keyless (for the transparency log).
# ot.exe is Authenticode-signed and the macOS binaries signed and notarized when their credentials are set.
# Homebrew and Scoop are only updated when their tokens are set.
version: 2
project_name: ot

before:
  hooks:
    - go mod tidy

builds:
  - id: ot
    main: ./cmd/ot
    binary: ot
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/otinstaller/otinstaller/cli/internal/cli.Version=v{{ .Version }}
      - -X github.com/otinstaller/otinstaller/cli/internal/selfupdate.Repo={{ envOrDefault "RELEASE_OWNER" "otinstaller" }}/{{ envOrDefault "RELEASE_NAME" "ot" }}
      - -X github.com/otinstaller/otinstaller/cli/internal/selfupdate.PublicKey={{ .Env.OT_RELEASE_PUBLIC_KEY }}
    hooks:
      post:
        # Authenticode for ot.exe, before archives and checksums; a no-op until WINDOWS_SIGN_STORETYPE is set
        # (docs/code-signing.md).
        - cmd: sh scripts/sign-windows.sh "{{ .Path }}" "{{ .Target }}"
          output: true

# Signs and notarizes the macOS binaries with an Apple Developer ID (runs on Linux; no Mac needed). Off until
# MACOS_SIGN_P12 is set; notarization also needs the App Store Connect API key (docs/code-signing.md).
notarize:
  macos:
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      ids: [ot]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: ot
    # ot self-update and the install scripts look for exactly this name.
    name_template: "ot_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Paths are relative to cli/ (the workdir); the license is the repository's.
    files:
      - README.md
      - src: ../LICENSE
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  # Ed25519 over checksums.txt; the public half is built into ot.
  - id: release-key
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: openssl
    args: [pkeyutl, -sign, -rawin, -inkey, "{{ .Env.OT_RELEASE_KEY_FILE }}", -in, "${artifact}", -out, "${signature}"]
  # Keyless cosign, recorded in the public transparency log.
  - id: cosign
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.cosign.sig"
    certificate: "${artifact}.pem"
    args: [sign-blob, --yes, "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]

nfpms:
  - id: packages
    package_name: ot
    vendor: OSINTverse
    homepage: https://otinstaller.com
    maintainer: OTInstaller Registry <support@otinstaller.com>
    description: Install and run OSINT tools and guides from the OTInstaller Registry.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin

homebrew_casks:
  - name: ot
    repository:
      owner: otinstaller
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://otinstaller.com
    description: Install and run OSINT tools and guides from the OTInstaller Registry

scoops:
  - name: ot
    repository:
      owner: otinstaller
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://otinstaller.com
    description: Install and run OSINT tools and guides from the OTInstaller Registry
    license: Apache-2.0

release:
  github:
    owner: '{{ envOrDefault "RELEASE_OWNER" "otinstaller" }}'
    name: '{{ envOrDefault "RELEASE_NAME" "ot" }}'
  extra_files:
    # Copies with the public key filled in, written by the release workflow.
    - glob: ../dist/install/install.sh
    - glob: ../dist/install/install.ps1
