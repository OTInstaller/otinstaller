# Sigstore's official cosign image: a real keyless-signed image used to test signature checks.
schema: 1
name: cosign
namespace: sigstore
version: 3.1.3
summary: Sigstore's cosign CLI, packaged to test image signature verification
readme: README.md
license: Apache-2.0
homepage: https://github.com/sigstore/cosign
categories: [utilities]
inputs:
  - name: subcommand
    type: enum
    required: true
    values: [version]
outputs:
  - type: other
runtime:
  kind: docker
  image: ghcr.io/sigstore/cosign/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
  platforms: [linux/amd64, linux/arm64]
  command: ["cosign", "{subcommand}"]
  output_format: text
  timeout_seconds: 60
network:
  egress: false
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: false
test:
  input: { subcommand: "version" }
