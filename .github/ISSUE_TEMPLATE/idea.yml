name: Idea or missing feature
description: Something that would make OTInstaller more useful.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The investigation or publishing task, and where OTInstaller gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ot, Running tools, Publishing, Website, Guides, Other]
