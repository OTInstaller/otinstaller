# Releases otlite (otlite/) to PyPI with trusted publishing. Push a tag `otlite-vX.Y.Z` whose version matches
# otlite/pyproject.toml; run the workflow by hand with `repository: testpypi` for a dry run first.
# The `otinstaller` shim (otlite/otinstaller-shim) is built alongside and published after otlite by its own step;
# a version PyPI already has is skipped, so bump its version only when it changes. To retry a failed release, run the
# workflow by hand with `repository: pypi`: it uploads what is missing and creates the GitHub release for an
# existing `otlite-vX.Y.Z` tag.
#
# Setup on PyPI (once, per project): Publishing → add a GitHub publisher with owner OTInstaller, repository
# otinstaller, workflow release-otlite.yml and environment pypi (or testpypi on test.pypi.org).
name: Release otlite

on:
  push:
    tags: ["otlite-v*.*.*"]
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: otlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "otlite-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not otlite-v$version"; exit 1; }
      - name: Tests
        run: |
          pip install -e ".[dev,pipeline]"
          ruff check .
          ruff format --check .
          pytest
        env:
          DO_NOT_TRACK: "1"
          RUN_NETWORK_TESTS: "0"
      - name: Build otlite and the otinstaller shim
        run: |
          pip install build twine
          python -m build --outdir dist .
          python -m build --outdir dist otinstaller-shim
          twine check dist/*
          ls -l dist
      - name: The built wheel installs and runs
        run: |
          python -m venv check
          check/bin/pip install dist/otlite-*.whl
          check/bin/otlite --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: otlite/dist/

  # Each package is uploaded by its own step, otlite first. A trusted-publishing token only covers the projects
  # whose publisher matches this run, so a problem with the otinstaller shim's publisher must never block otlite.
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/otlite/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Separate otlite from the shim
        run: |
          mkdir dist-otlite dist-shim
          mv dist/otlite-* dist-otlite/
          mv dist/otinstaller-* dist-shim/
          ls -l dist-otlite dist-shim
      - name: Publish otlite
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-otlite/
          skip-existing: true
          print-hash: true
      - name: Publish the otinstaller shim
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-shim/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/otlite/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Separate otlite from the shim
        run: |
          mkdir dist-otlite dist-shim
          mv dist/otlite-* dist-otlite/
          mv dist/otinstaller-* dist-shim/
          ls -l dist-otlite dist-shim
      - name: Publish otlite
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-otlite/
          skip-existing: true
          print-hash: true
      - name: GitHub release with the archives
        # On a manual run the tag must already exist (--verify-tag): this never creates a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdist="$(basename dist-otlite/otlite-*.tar.gz .tar.gz)"
          version="${sdist#otlite-}"
          tag="otlite-v${version}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" dist-otlite/* dist-shim/* --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "$tag" --notes "otlite ${version}. Changes: https://github.com/${GITHUB_REPOSITORY}/blob/main/otlite/CHANGELOG.md"
          fi
      - name: Publish the otinstaller shim
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-shim/
          skip-existing: true
          print-hash: true
