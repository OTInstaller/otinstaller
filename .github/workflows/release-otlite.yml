# Releases otlite (otlite/) to PyPI with trusted publishing. Push a tag `otlite-vX.Y.Z` whose version matches
# otlite/pyproject.toml; run the workflow by hand with `repository: testpypi` for a dry run first.
# The `otinstaller` shim (otlite/otinstaller-shim) is built and published alongside; a version PyPI already has
# is skipped, so bump its version only when it changes.
#
# Setup on PyPI (once, per project): Publishing → add a GitHub publisher with owner OTInstaller, repository
# otinstaller, workflow release-otlite.yml and environment pypi (or testpypi on test.pypi.org).
name: Release otlite

on:
  push:
    tags: ["otlite-v*.*.*"]
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: otlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "otlite-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not otlite-v$version"; exit 1; }
      - name: Tests
        run: |
          pip install -e ".[dev,pipeline]"
          ruff check .
          ruff format --check .
          pytest
        env:
          DO_NOT_TRACK: "1"
          RUN_NETWORK_TESTS: "0"
      - name: Build otlite and the otinstaller shim
        run: |
          pip install build twine
          python -m build --outdir dist .
          python -m build --outdir dist otinstaller-shim
          twine check dist/*
          ls -l dist
      - name: The built wheel installs and runs
        run: |
          python -m venv check
          check/bin/pip install dist/otlite-*.whl
          check/bin/otlite --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: otlite/dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/otlite/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/otlite/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true
      - name: GitHub release with the archives
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes "otlite ${GITHUB_REF_NAME#otlite-v}. Changes: https://github.com/${GITHUB_REPOSITORY}/blob/main/otlite/CHANGELOG.md"
