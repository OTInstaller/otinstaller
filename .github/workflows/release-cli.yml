# Releases ot when a vX.Y.Z tag is pushed: builds for Windows, macOS and Linux (amd64 and arm64), signs
# checksums.txt with the release key and with cosign, and publishes to the public release repository.
#
# Secrets: RELEASE_GITHUB_TOKEN (contents: write on the release repository), OT_RELEASE_KEY (the Ed25519 private
# key, PEM), optional TAP_GITHUB_TOKEN (homebrew-tap and scoop-bucket). Variables: OT_RELEASE_PUBLIC_KEY (base64
# raw public key), optional RELEASE_OWNER and RELEASE_NAME (default OTInstaller/ot).
#
# Code signing, each off until its settings exist (docs/code-signing.md):
# - Windows, Azure Trusted Signing: variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   TRUSTED_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net), TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE.
#   Or an OV certificate on a cloud HSM: variables WINDOWS_SIGN_STORETYPE, WINDOWS_SIGN_KEYSTORE, WINDOWS_SIGN_ALIAS
#   and secret WINDOWS_SIGN_STOREPASS.
# - macOS, Apple Developer ID: secrets MACOS_SIGN_P12 (base64), MACOS_SIGN_PASSWORD, MACOS_NOTARY_KEY (base64 .p8),
#   MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID.
name: release ot
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  id-token: write # cosign keyless
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - uses: sigstore/cosign-installer@v3
      - name: Write the release key
        env:
          OT_RELEASE_KEY: ${{ secrets.OT_RELEASE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OT_RELEASE_KEY" > "$RUNNER_TEMP/release-key.pem"
          echo "OT_RELEASE_KEY_FILE=$RUNNER_TEMP/release-key.pem" >> "$GITHUB_ENV"
      - name: Put the public key in the install scripts
        env:
          OT_RELEASE_PUBLIC_KEY: ${{ vars.OT_RELEASE_PUBLIC_KEY }}
        # Written to dist/install (ignored by git): GoReleaser refuses to release from a checkout with modified files.
        run: |
          mkdir -p dist/install
          for s in install.sh install.ps1; do
            sed "s|__OT_RELEASE_PUBLIC_KEY__|${OT_RELEASE_PUBLIC_KEY}|" "scripts/install/$s" > "dist/install/$s"
          done
          grep -q "__OT_RELEASE_PUBLIC_KEY__" dist/install/* && { echo "::error::OT_RELEASE_PUBLIC_KEY is not set"; exit 1; } || true
      # Windows signing. Azure Trusted Signing signs in with OIDC (a federated credential on the app registration), so
      # there is no Azure secret to store; the access token lasts about an hour, longer than the release takes.
      - name: Sign in to Azure (Trusted Signing)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Windows signing
        if: vars.AZURE_CLIENT_ID != '' || vars.WINDOWS_SIGN_STORETYPE != ''
        env:
          TRUSTED: ${{ vars.AZURE_CLIENT_ID != '' }}
          ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          STORETYPE: ${{ vars.WINDOWS_SIGN_STORETYPE }}
          KEYSTORE: ${{ vars.WINDOWS_SIGN_KEYSTORE }}
          ALIAS: ${{ vars.WINDOWS_SIGN_ALIAS }}
        run: |
          jar="$RUNNER_TEMP/jsign.jar"
          curl -fsSL -o "$jar" https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  $jar" | sha256sum -c -
          echo "JSIGN_JAR=$jar" >> "$GITHUB_ENV"
          if [ "$TRUSTED" = true ]; then
            token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
            echo "::add-mask::$token"
            {
              echo "WINDOWS_SIGN_STORETYPE=TRUSTEDSIGNING"
              echo "WINDOWS_SIGN_KEYSTORE=${ENDPOINT#https://}"
              echo "WINDOWS_SIGN_ALIAS=$ACCOUNT/$PROFILE"
              echo "WINDOWS_SIGN_STOREPASS=$token"
            } >> "$GITHUB_ENV"
          else
            {
              echo "WINDOWS_SIGN_STORETYPE=$STORETYPE"
              echo "WINDOWS_SIGN_KEYSTORE=$KEYSTORE"
              echo "WINDOWS_SIGN_ALIAS=$ALIAS"
            } >> "$GITHUB_ENV"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          OT_RELEASE_PUBLIC_KEY: ${{ vars.OT_RELEASE_PUBLIC_KEY }}
          # An unset variable is an empty string, which GoReleaser's envOrDefault takes as set: default here.
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER || 'OTInstaller' }}
          RELEASE_NAME: ${{ vars.RELEASE_NAME || 'ot' }}
          # OV certificate on a cloud HSM; with Trusted Signing the step above sets the token instead.
          WINDOWS_SIGN_STOREPASS: ${{ env.WINDOWS_SIGN_STOREPASS || secrets.WINDOWS_SIGN_STOREPASS }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # MCP Bundles (one per platform, for Claude Desktop and the MCP Registry) from the binaries GoReleaser just built
      # and signed (cli/cmd/mcpb), uploaded to the same release with the registry's server.json. Publishing server.json
      # to the registry is a manual step (docs/publishing-setup.md, "MCP Registry").
      - name: Build and upload the MCP bundles
        working-directory: cli
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          REPO: ${{ vars.RELEASE_OWNER || 'OTInstaller' }}/${{ vars.RELEASE_NAME || 'ot' }}
        run: |
          TAG="$GITHUB_REF_NAME"
          go run ./cmd/mcpb -version "${TAG#v}" -dist dist -out dist/mcpb -release-url "https://github.com/$REPO/releases/download/$TAG"
          gh release upload "$TAG" dist/mcpb/*.mcpb dist/mcpb/server.json --repo "$REPO" --clobber
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
