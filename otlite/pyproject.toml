[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otlite"
version = "1.1.0"
description = "Install, run and update command line tools by name, without Docker. The lightweight edition of OTInstaller."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "otlite contributors"}]
keywords = ["tools", "cli", "installer", "package-manager", "otinstaller"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.20.0,<1",
    "click>=8.1.0",
    "rich>=13.8.0",
    "pyyaml>=6.0",
    "sentry-sdk>=2.0,<3",
]

[project.urls]
Homepage = "https://otinstaller.com"
Documentation = "https://otinstaller.com/docs/otlite"
Repository = "https://github.com/OTInstaller/otinstaller"
Source = "https://github.com/OTInstaller/otinstaller/tree/main/otlite"
Changelog = "https://github.com/OTInstaller/otinstaller/blob/main/otlite/CHANGELOG.md"
Issues = "https://github.com/OTInstaller/otinstaller/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.10",
]
pipeline = [
    "requests",
]

[project.scripts]
otlite = "otlite.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/otlite"]

[tool.hatch.build.targets.sdist]
include = ["src/otlite", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "llms.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (set RUN_NETWORK_TESTS=1 to run)",
]
asyncio_mode = "auto"
