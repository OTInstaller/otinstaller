# Copy to .github/workflows/scan.yml in the registry-ops repository.
# The registry dispatches one "otinstaller-scan" event per release; this job scans it and posts the results to
# the registry with the single-use token in the payload. When the version is published, the registry answers
# with a backup job, and the same run copies the image to the mirror (or uploads the wheel) and a git bundle.
# "otinstaller-backup" events (weekly git backups, approved releases) and the monthly "otinstaller-drill"
# (restore a bundle into an empty repository, pull a mirrored image by digest) run here too.
# Needs the secret MIRROR_PUSH_TOKEN (the mirror's push credential) and the variable MIRROR_HOST
# (mirror.otinstaller.com).
name: scan
on:
  repository_dispatch:
    types: [otinstaller-scan, otinstaller-backup, otinstaller-drill]
permissions:
  contents: read
  # Keyless signing of the sandbox images pipx scans push to the mirror (scan.py push_sandbox); ot checks that this
  # workflow signed them (the API's SANDBOX_SIGNER_IDENTITY, by default scan.yml on main).
  id-token: write
concurrency:
  group: ${{ github.event.action }}-${{ github.event.client_payload.scan.version_id || github.event.client_payload.drill.id || github.run_id }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
      MIRROR_HOST: ${{ vars.MIRROR_HOST || 'mirror.otinstaller.com' }}
    steps:
      - uses: actions/checkout@v5
      - if: github.event.action == 'otinstaller-scan'
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.0
          cache: true
      # Trivy's vulnerability database (tens of MB) is downloaded once per six-hour window, when it is republished,
      # instead of by every scan. A scan that finds this window's copy doesn't ask for a newer one.
      - id: window
        if: github.event.action == 'otinstaller-scan'
        run: echo "key=trivy-db-$(date -u +%F)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"
      - id: trivy-db
        if: github.event.action == 'otinstaller-scan'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy/db
          key: ${{ steps.window.outputs.key }}
          restore-keys: trivy-db-
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: imjasonh/setup-crane@v0.4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/scanner/requirements.txt
      - if: github.event.action == 'otinstaller-scan'
        run: pip install -r ops/scanner/requirements.txt
      # Docker too: images publishers pushed to the mirror are only served to this credential until they are published.
      - name: Log in to the mirror
        if: env.MIRROR_PUSH_TOKEN != ''
        run: |
          printf '%s' "$MIRROR_PUSH_TOKEN" | crane auth login "$MIRROR_HOST" -u scanner --password-stdin
          printf '%s' "$MIRROR_PUSH_TOKEN" | docker login "$MIRROR_HOST" -u scanner --password-stdin
      - name: Write the request
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/request.json"
      - name: Scan, back up and report
        env:
          # Only an exact hit is this window's database; an older one restored by prefix is still updated.
          TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-db.outputs.cache-hit == 'true' }}
        run: python3 ops/scanner/scan.py "$RUNNER_TEMP/request.json" --post
