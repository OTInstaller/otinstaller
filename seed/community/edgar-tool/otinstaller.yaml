# Converted from the package manager's catalog by scripts/pm-catalog-to-wrappers.py.
schema: 1
name: edgar-tool
namespace: osintverse-community
version: 2.1.2
summary: "Command line interface to search and retrieve corporate and financial data from the SEC EDGAR database"
readme: README.md
license: MIT
homepage: https://github.com/bellingcat/edgar
categories: [people, company]
tags: [sec, edgar, financial, financial-data, corporate-research]
inputs:
  - name: query
    type: string
    required: true
outputs:
  - type: other
runtime:
  kind: pipx
  package: edgar-tool
  package_version: "2.1.2"
  index: pypi
  python: ">=3.9"
  entrypoint: edgar
  wheel_sha256: "49a706bc6499ca0aea558cf8b4c6d8f3ce164385404a7102c38fb8baf79a3505"
  command: ["edgar", "text-search", "{query}"]
  output_format: text
  timeout_seconds: 900
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: true
test:
  input: {"query": "example"}
