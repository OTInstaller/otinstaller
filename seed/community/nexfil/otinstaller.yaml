# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
# Converted from the package manager's catalog by scripts/pm-catalog-to-wrappers.py.
schema: 1
name: nexfil
namespace: osintverse-community
version: 1.0.6
summary: "OSINT tool for finding profiles by username"
readme: README.md
license: MIT
homepage: https://github.com/thewhiteh4t/nexfil
categories: [username, social-media]
tags: [username, social-media, username-search]
inputs:
  - name: username
    type: username
    required: true
outputs:
  - type: account
runtime:
  kind: pipx
  package: nexfil
  package_version: "1.0.6"
  index: pypi
  python: ">=3.10"
  entrypoint: nexfil
  wheel_sha256: "be39b39888b28ff95307b1bdd31635cd8d8a4bc2ae64a1da8ccb3177160d95c6"
  command: ["nexfil", "-u", "{username}"]
  output_format: text
  timeout_seconds: 900
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: true
test:
  input: {"username": "github"}
