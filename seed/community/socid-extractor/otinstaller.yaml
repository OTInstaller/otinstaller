# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
# Converted from the package manager's catalog by scripts/pm-catalog-to-wrappers.py.
schema: 1
name: socid-extractor
namespace: osintverse-community
version: 0.1.1
summary: "The extraction engine behind Maigret: turn any profile URL into a structured OSINT record across 150+ sites"
readme: README.md
license: MIT
homepage: https://github.com/soxoj/socid-extractor
categories: [web-archive, username, documents-metadata]
tags: [metadata, username, social-media, profile, metadata-extraction, username-search]
inputs:
  - name: url
    type: url
    required: true
outputs:
  - type: other
runtime:
  kind: pipx
  package: socid-extractor
  package_version: "0.1.1"
  index: pypi
  python: ">=3.10"
  entrypoint: socid_extractor
  wheel_sha256: "62c32044979d02b4eb2ebc22e1829d4b08ef73294e1aada41ddc52790ff9e958"
  command: ["socid_extractor", "--url", "{url}"]
  output_format: text
  timeout_seconds: 900
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: true
test:
  input: {"url": "https://example.com"}
