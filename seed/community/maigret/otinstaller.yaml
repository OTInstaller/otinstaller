# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: maigret
namespace: osintverse-community
version: 0.6.8
summary: "Builds a profile of a person from a username: accounts on 3,000+ sites and the details they expose"
readme: README.md
license: MIT
homepage: https://github.com/soxoj/maigret
categories: [username, social-media]
tags: [username, accounts, profile]
inputs:
  - name: username
    type: username
    required: true
  - name: site
    type: string
    required: false
    description: "Only check this site, such as GitHub"
  - name: top_sites
    type: integer
    required: false
    description: "How many of the most popular sites to check (default 500)"
outputs:
  - type: account
  - type: url
  - type: person
runtime:
  kind: pipx
  package: maigret
  package_version: "0.6.6"
  index: pypi
  python: "<4.0,>=3.10"
  entrypoint: maigret
  wheel_sha256: "f382e7174d202a8002b2ac3ce3cde7c11900c506399dd6110f57b9256c4181c7"
  command: ["maigret", "--no-color", "--no-progressbar", "--no-autoupdate", "--folderoutput", "/tmp/maigret", "--timeout", "20", "--top-sites", "{top_sites}", "--site", "{site}", "{username}"]
  output_format: text
  # Entities come only from lines that start with these, not from banners, sponsor links or update notices.
  finding_prefixes: ["[+]", "├─", "└─"]
  timeout_seconds: 1200
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: true
test:
  input: { username: "github", site: "GitHub" }
