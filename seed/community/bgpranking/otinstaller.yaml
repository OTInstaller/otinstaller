# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: bgpranking
namespace: osintverse-community
version: 2.0.2
summary: "Shows an autonomous system's BGP Ranking from CIRCL: how much malicious activity its networks host"
readme: README.md
license: BSD-3-Clause
homepage: https://github.com/D4-project/pybgpranking
categories: [ip-network]
tags: [asn, bgp, reputation, circl]
inputs:
  - name: asn
    type: string
    required: true
    description: "Autonomous system number, without the AS prefix"
    example: "15169"
outputs:
  - type: organization
    description: "The network's owner, with its rank and position among the networks BGP Ranking knows"
runtime:
  kind: pipx
  package: pybgpranking2
  package_version: "2.0.2"
  index: pypi
  python: "<4.0,>=3.8"
  entrypoint: bgpranking
  wheel_sha256: "278c5d9a3d60b76ef6003acc094b15d10c67744923efbfbafedfd5b67556b0a8"
  command: ["bgpranking", "simple", "--asn", "{asn}"]
  output_format: json
  timeout_seconds: 60
  typical_seconds: 2
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: false
  notifies_target: false
test:
  input: { asn: "15169" }
