# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: pyfunceble
namespace: osintverse-community
version: 4.3.1
summary: "Checks whether a domain is active, inactive or invalid using WHOIS, DNS and HTTP status lookups"
readme: README.md
license: Apache-2.0
homepage: https://github.com/funilrys/PyFunceble
categories: [domain-dns]
tags: [availability, whois, dns, blocklist]
inputs:
  - name: domain
    type: domain
    required: true
    example: "example.com"
outputs:
  - type: domain
  - type: other
    description: "Availability status, its source and the expiration date"
runtime:
  kind: pipx
  package: PyFunceble
  package_version: "4.3.1"
  index: pypi
  python: "<4,>=3.10"
  entrypoint: pyfunceble
  wheel_sha256: "15e8357cbdb786603a4d13b5234bb9cfb311dfaa71873a0d08ab6201611bd99a"
  command: ["pyfunceble", "--no-files", "--colour", "-a", "-d", "{domain}"]
  output_format: text
  timeout_seconds: 300
  typical_seconds: 30
network:
  egress: true
ethics:
  touches_target: true
  auth_required: false
  collects_personal_data: false
  notifies_target: false
  notes: "The HTTP status check requests the domain's web server, so its logs see your IP address."
test:
  input: { domain: "example.com" }
