# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: phishtank-lookup
namespace: osintverse-community
version: 1.6.0
summary: "Checks a URL against CIRCL's copy of the PhishTank feed of verified phishing pages"
readme: README.md
license: BSD-3-Clause
homepage: https://github.com/Lookyloo/PyPhishtankLookup
categories: [domain-dns, utilities]
tags: [phishing, phishtank, url-reputation, circl]
inputs:
  - name: url
    type: url
    required: true
    example: "https://example.com/"
outputs:
  - type: url
    description: "The PhishTank entry: targeted brand, verification and submission dates"
runtime:
  kind: pipx
  package: pyphishtanklookup
  package_version: "1.6.0"
  index: pypi
  python: "<3.16,>=3.11"
  entrypoint: phishtank-lookup
  wheel_sha256: "268fcc405555d26a93445d81f11ceec21d79b8846d991256aef9475c5fbfa979"
  command: ["phishtank-lookup", "--url_query", "{url}"]
  output_format: json
  timeout_seconds: 60
  typical_seconds: 2
network:
  egress: true
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: false
  notifies_target: false
test:
  input: { url: "https://example.com/" }
