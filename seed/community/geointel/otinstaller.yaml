# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: geointel
namespace: osintverse-community
version: 0.2.0
summary: "Guesses where a photo was taken by sending the image to Google's Gemini model for analysis"
readme: README.md
license: MIT
homepage: https://github.com/atiilla/GeoIntel
categories: [images-geo]
tags: [geolocation, photos, ai, gemini]
inputs:
  - name: image_url
    type: url
    required: true
    description: "Public URL of the photo to analyse"
    example: "https://otinstaller.com/og.png"
  - name: context
    type: string
    required: false
    description: "Extra context about the photo"
  - name: guess
    type: string
    required: false
    description: "Your own guess of the location, such as Mediterranean coast"
outputs:
  - type: location
  - type: url
    description: "Google Maps link for each candidate location"
secrets:
  - name: GEMINI_API_KEY
    required: true
    description: "Your Google Gemini API key"
    url: https://aistudio.google.com/app/apikey
    pricing: free_tier
runtime:
  kind: pipx
  package: geointel
  package_version: "0.2.0"
  index: pypi
  python: ">=3.8"
  entrypoint: geointel
  wheel_sha256: "c1ce9ea334e4473d3b1cce79ca412e3d27e540a87180005f5ee2d37facbe4f68"
  command: ["geointel", "--image", "{image_url}", "--context", "{context}", "--guess", "{guess}"]
  output_format: text
  timeout_seconds: 300
  typical_seconds: 30
network:
  egress: true
ethics:
  touches_target: false
  auth_required: true
  collects_personal_data: false
  notifies_target: false
  notes: "The image is downloaded from the URL you give and sent to Google's Gemini API. Location guesses are AI output and can be wrong; don't use it to locate private people."
test:
  expect_exit_code: 1
  input: { image_url: "https://otinstaller.com/og.png" }
