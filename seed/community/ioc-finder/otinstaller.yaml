# OTInstaller manifest. Reference: https://otinstaller.com/docs/manifest
# yaml-language-server: $schema=https://otinstaller.com/schema/v1.json
schema: 1
name: ioc-finder
namespace: osintverse-community
version: 9.4.1
summary: "Extracts indicators such as URLs, domains, IPs, emails, hashes and CVEs from a piece of text"
readme: README.md
license: LGPL-3.0
homepage: https://github.com/fhightower/ioc-finder
categories: [utilities, ip-network, domain-dns]
tags: [ioc, parsing, indicators, threat-intel, offline]
inputs:
  - name: text
    type: string
    required: true
    description: "Text to parse (defanged indicators like example[.]com are refanged)"
    example: "Contact example@example.com about 1.1.1.1 and https://example.com/a"
outputs:
  - type: url
  - type: domain
  - type: ip
  - type: email
  - type: crypto_address
  - type: other
    description: "Hashes, CVEs, ASNs, file paths and other observables"
runtime:
  kind: pipx
  package: ioc-finder
  package_version: "9.4.1"
  index: pypi
  python: ">=3.10"
  entrypoint: ioc-finder
  wheel_sha256: "d7f4ebb76b450f22f5ee26eea6e8d4ffbda972b3c82d7efa1a9ca74294703e37"
  command: ["ioc-finder", "--all", "{text}"]
  output_format: json
  timeout_seconds: 120
  typical_seconds: 2
network:
  egress: false
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: false
  notifies_target: false
test:
  input: { text: "Contact example@example.com about 1.1.1.1 and https://example.com/a" }
