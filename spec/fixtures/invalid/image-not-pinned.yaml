# expect: manifest_image_not_pinned
schema: 1
name: holehe-lite
namespace: dheeraj
version: 1.2.0
summary: Checks which sites an email address is registered on
readme: README.md
license: MIT
homepage: https://github.com/dheeraj/holehe-lite
categories: [email, social-media]
tags: [registration-check, passive]
inputs:
  - name: email
    type: email
    required: true
  - name: timeout
    type: integer
    required: false
    default: 10
outputs:
  - type: account
runtime:
  kind: docker
  image: ghcr.io/dheeraj/holehe-lite:latest
  platforms: [linux/amd64, linux/arm64]
  command: ["holehe", "--json", "--timeout", "{timeout}", "{email}"]
  output_format: json
  timeout_seconds: 300
secrets:
  - name: HIBP_API_KEY
    required: false
    description: Adds breach data to results
    url: https://haveibeenpwned.com/API/Key
network:
  egress: true
  domains: ["*.twitter.com", "api.github.com"]
ethics:
  touches_target: false
  auth_required: false
  collects_personal_data: true
test:
  input: { email: "test@example.com" }
  expect_exit_code: 0
