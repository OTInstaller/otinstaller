# Builds the image, signs it with GitLab's OIDC token, pins its digest and tags the release.
# To release: set version: in otinstaller.yaml (e.g. 1.2.0), commit, then Build > Pipelines > Run pipeline.
# (A VERSION variable, where the project allows pipeline variables, overrides it.)
# It pushes the release commit and tag with the job token: turn on Settings > CI/CD > Job token permissions >
# "Allow Git push requests to the repository". Or set RELEASE_TOKEN to a token with write_repository (a project
# access token on paid plans, or a personal access token).
# A connected project is published from its tag. Without connecting it, trust this project
# (`ot namespace trust <namespace> gitlab:<group>/<project>`) and set the CI/CD variable OTINSTALLER_PUBLISH to oidc,
# and the last line publishes the release itself.
otinstaller-release:
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
    OTINSTALLER_ID_TOKEN:
      aud: otinstaller
  script:
    - apk add --no-cache git cosign
    - |-
      VERSION="${VERSION:-$(sed -n 's/^version: *//p' otinstaller.yaml | tr -d '"\r ')}"; VERSION="${VERSION#v}"
    - echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "'$VERSION' is not a version like 1.2.0"; exit 1; }
    - AUTH="${RELEASE_TOKEN:+oauth2:$RELEASE_TOKEN}"; AUTH="${AUTH:-gitlab-ci-token:$CI_JOB_TOKEN}"
    - REMOTE="https://${AUTH}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION is already released; raise version in otinstaller.yaml"; exit 1; fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # arm64 is built under QEMU on the amd64 runner.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use
    - docker buildx build --platform linux/amd64,linux/arm64 --push -t "$CI_REGISTRY_IMAGE:$VERSION" --metadata-file meta.json .
    - |-
      DIGEST=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' meta.json)
    - cosign sign --yes "$CI_REGISTRY_IMAGE@$DIGEST"
    - |-
      sed -i -E "s|^version: .*|version: $VERSION|; s|^  image: .*|  image: $CI_REGISTRY_IMAGE@$DIGEST|" otinstaller.yaml
    - git config user.name "otinstaller release"
    - git config user.email "release@otinstaller.invalid"
    - git diff --quiet || git commit -qam "Release $VERSION"
    - git tag "v$VERSION"
    - git push --atomic "$REMOTE" HEAD:$CI_DEFAULT_BRANCH "v$VERSION"
    - |-
      if [ "$OTINSTALLER_PUBLISH" = oidc ]; then apk add --no-cache curl && curl -fsSL https://get.otinstaller.com/ot | OT_INSTALL_DIR=/usr/local/bin sh && ot publish --oidc; fi
